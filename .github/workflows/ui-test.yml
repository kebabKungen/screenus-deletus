name: UI test (emulator)

on:
  push:
  workflow_dispatch:

jobs:
  ui-tour:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug app and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI tour on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./scripts/ui-tour.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-tour
          path: |
            screenshots/
            logcat.txt
            instrument.txt
          if-no-files-found: warn

      - name: Commit screenshots to the branch
        if: always() && github.event_name != 'pull_request'
        run: |
          shopt -s nullglob
          files=(screenshots/*.png)
          [ ${#files[@]} -eq 0 ] && exit 0
          rm -rf docs/screenshots && mkdir -p docs/screenshots
          cp "${files[@]}" docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/screenshots
          git diff --cached --quiet && exit 0
          git commit -m "Update UI screenshots from emulator run [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep 5
          done
